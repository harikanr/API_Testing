name: FakeRestAPI — API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Create results directory
        run: mkdir -p test-results

      - name: Run FakeRestAPI tests
        run: |
          newman run collections/FakeRestAPI_Tests.postman_collection.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export test-results/report.html \
            --reporter-htmlextra-title "FakeRestAPI Test Report" \
            --timeout-request 15000

      - name: Upload HTML test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: test-results/
          retention-days: 30
